apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  labels:
    app: cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
        - name: web
          # Stock public image - no custom image build / registry needed.
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir -r /app/requirements.txt && python /app/app.py
          env:
            - name: APP_VERSION
              value: "APP_VERSION_PLACEHOLDER"
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: app-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: app-code
          configMap:
            name: cicd-demo-code
